name: Android APK Release

# Builds signed Flutter release APK (Obtainium) + App Bundle (Play Store upload)
# and publishes both to GitHub Releases.
#
# Triggers:
#   • push to main – when app/** or this workflow change
#   • workflow_dispatch – build on demand
#
# Versioning (automatic):
#   • versionName / Git tag: 0.1.<build> where build = run_number - ANDROID_VERSION_EPOCH
#   • versionCode (internal): github.run_number — always increases, never resets
#
# Optional repo variables (Settings → Actions → Variables):
#   ANDROID_VERSION_EPOCH – subtract from run_number for 0.1.x display (default 0)
#   FXROWS_AGG_URL – optional default for Advanced self-hosted aggregator only
#
# Required secrets for signing (stable Obtainium updates, keystore never committed):
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/android-apk.yml"

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Compute Android version
        working-directory: .
        run: |
          EPOCH="${{ vars.ANDROID_VERSION_EPOCH }}"
          EPOCH="${EPOCH:-0}"
          BUILD=$(( ${{ github.run_number }} - EPOCH ))
          if [ "$BUILD" -lt 1 ]; then
            echo "::error::ANDROID_VERSION_EPOCH ($EPOCH) must be less than workflow run_number (${{ github.run_number }})."
            exit 1
          fi
          echo "ANDROID_VERSION_CODE=${{ github.run_number }}" >> "$GITHUB_ENV"
          echo "ANDROID_VERSION_NAME=0.1.${BUILD}" >> "$GITHUB_ENV"
          echo "APK_RELEASE_TAG=v0.1.${BUILD}" >> "$GITHUB_ENV"
          echo "Release version 0.1.${BUILD} (versionCode ${{ github.run_number }}, epoch ${EPOCH})"

      - name: Decode release keystore
        working-directory: .
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "${ANDROID_KEYSTORE_BASE64}" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is not set. Obtainium updates require a stable signature; see README."
            exit 1
          fi
          echo "${ANDROID_KEYSTORE_BASE64}" | base64 -d > app/android/release.keystore
          echo "Decoded release keystore from repo secrets"

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK and App Bundle
        env:
          ANDROID_KEYSTORE_FILE: release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          FXROWS_AGG_URL: ${{ vars.FXROWS_AGG_URL }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_PASSWORD:-}" ] || [ -z "${ANDROID_KEY_ALIAS:-}" ] || [ -z "${ANDROID_KEY_PASSWORD:-}" ]; then
            echo "::error::ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, and ANDROID_KEY_PASSWORD secrets are required."
            exit 1
          fi
          AGG_URL="${FXROWS_AGG_URL:-https://fxrows.wynpakt.com}"
          echo "Baking FXROWS_AGG_URL=${AGG_URL}"
          COMMON=(
            --release
            --build-name="${ANDROID_VERSION_NAME}"
            --build-number="${ANDROID_VERSION_CODE}"
            --dart-define=FXROWS_AGG_URL="${AGG_URL}"
          )
          flutter build apk "${COMMON[@]}"
          flutter build appbundle "${COMMON[@]}"

      - name: Prepare artifacts
        working-directory: .
        run: |
          cp app/build/app/outputs/flutter-apk/app-release.apk fxrows.apk
          cp app/build/app/outputs/bundle/release/app-release.aab fxrows.aab
          ls -lh fxrows.apk fxrows.aab

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.APK_RELEASE_TAG }}
          name: fxrows Android ${{ env.ANDROID_VERSION_NAME }}
          body: |
            Automated Android build from commit ${{ github.sha }}.

            - App: **fxrows** (`com.wynpakt.fxrows`)
            - Version: `${{ env.ANDROID_VERSION_NAME }}` (versionCode `${{ env.ANDROID_VERSION_CODE }}`)
            - `fxrows.apk` — sideload / [Obtainium](https://github.com/ImranR98/Obtainium)
            - `fxrows.aab` — upload to Google Play Console (see `docs/PLAY_STORE.md`)
          files: |
            fxrows.apk
            fxrows.aab
          prerelease: true
          make_latest: true
